<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="lockGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Background base -->
  <rect width="64" height="64" rx="14" fill="#090d16" />

  <!-- Outer Cyber Shield border -->
  <path d="M 32 6 L 54 14 V 32 C 54 46 32 58 32 58 C 32 58 10 46 10 32 V 14 Z" fill="none" stroke="url(#shieldGrad)" stroke-width="2.5" filter="url(#glow)"/>

  <!-- Inner Shackle (Lock) -->
  <path d="M 23 26 V 19 C 23 14 41 14 41 19 V 26" fill="none" stroke="#00f0ff" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Lock Body -->
  <rect x="20" y="25" width="24" height="22" rx="4" fill="url(#lockGrad)" stroke="#00f0ff" stroke-width="2" />

  <!-- Keyhole (Red/Crimson Glow) -->
  <circle cx="32" cy="33" r="3.5" fill="#ff0055" filter="url(#glow)"/>
  <polygon points="30,34 34,34 35,42 29,42" fill="#ff0055" filter="url(#glow)"/>

  <!-- Laser Cut Accent -->
  <line x1="12" y1="46" x2="52" y2="18" stroke="#ff0055" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.8" />
</svg>
